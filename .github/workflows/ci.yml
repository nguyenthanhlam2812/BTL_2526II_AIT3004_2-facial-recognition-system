name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: tlam281206

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            libsm6 \
            libxext6

      - name: Install backend test dependencies
        run: pip install -r requirements/backend.txt -r requirements/test.txt

      - name: Run backend tests
        run: pytest tests/backend -q --tb=short

  frontend-check:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate default compose config
        run: docker compose config

      - name: Validate tunnel compose config
        run: docker compose -f docker-compose.yml -f docker-compose.tunnel.yml --profile tunnel config

  docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-check
      - compose-config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/ai-facial-recognition-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/ai-facial-recognition-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/ai-facial-recognition-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/ai-facial-recognition-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dockerhub-smoke:
    name: Docker Hub smoke test
    runs-on: ubuntu-latest
    needs:
      - docker-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull published images
        run: docker compose pull

      - name: Start published stack
        run: docker compose up -d

      - name: Wait for backend and frontend health
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8000/healthz >/dev/null && curl -fsS http://localhost:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time." >&2
          docker compose logs backend frontend worker nginx
          exit 1

      - name: Verify login and authenticated settings
        run: |
          login_response=$(curl -fsS \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123"}' \
            http://localhost:8080/api/auth/login)
          token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$login_response")
          curl -fsS \
            -H "Authorization: Bearer $token" \
            http://localhost:8080/api/system/settings >/dev/null

      - name: Verify kiosk token enforcement
        run: |
          : > empty.jpg
          direct_status=$(curl -sS -o direct.json -w "%{http_code}" \
            -F "image=@empty.jpg;type=image/jpeg" \
            -F "action_type=check_in" \
            http://localhost:8000/api/attendance/frame)
          test "$direct_status" = "401"
          python -c 'import json; data=json.load(open("direct.json")); assert data["detail"] == "Invalid kiosk token."'

          proxied_status=$(curl -sS -o proxied.json -w "%{http_code}" \
            -F "image=@empty.jpg;type=image/jpeg" \
            -F "action_type=check_in" \
            http://localhost:8080/api/attendance/frame)
          test "$proxied_status" = "400"
          python -c 'import json; data=json.load(open("proxied.json")); assert data["detail"] == "Image file is empty."'

      - name: Stop stack
        if: always()
        run: docker compose down -v
