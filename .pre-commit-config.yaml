# Pre-commit hooks cho AI Facial Recognition.
# Cài đặt:
#   pip install pre-commit
#   pre-commit install
# Chạy thủ công với toàn bộ repo:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/(node_modules|dist|public/vendor)/
      - id: end-of-file-fixer
        exclude: ^frontend/(node_modules|dist|public/vendor)/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^frontend/(node_modules|dist|public/vendor)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --line-length=100]
        files: ^(backend|tests)/.*\.py$
      - id: ruff-format
        args: [--line-length=100]
        files: ^(backend|tests)/.*\.py$

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        language: system
        entry: npx --prefix frontend prettier --write
        files: ^frontend/src/.*\.(ts|tsx|css|md|json)$
        pass_filenames: true

      - id: eslint
        name: eslint (frontend)
        language: system
        entry: npx --prefix frontend eslint --max-warnings=0
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: true
