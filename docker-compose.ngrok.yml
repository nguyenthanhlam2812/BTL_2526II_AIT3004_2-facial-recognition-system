services:
  backend:
    environment:
      PUBLIC_DEMO_MODE: "true"

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - http
      - http://nginx:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env.docker}
    depends_on:
      - nginx
    ports:
      - "4040:4040"
    profiles:
      - ngrok
