services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-face_attendance}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: tlam281206/ai-facial-recognition-backend:latest
    restart: unless-stopped
    env_file:
      - path: .env.docker.example
        required: true
      - path: .env.docker
        required: false
    depends_on:
      - mysql
      - redis
      - minio
      - qdrant
    volumes:
      - insightface_models:/root/.insightface
    ports:
      - "8000:8000"

  worker:
    image: tlam281206/ai-facial-recognition-worker:latest
    restart: unless-stopped
    env_file:
      - path: .env.docker.example
        required: true
      - path: .env.docker
        required: false
    depends_on:
      - mysql
      - redis
      - minio
      - qdrant
    volumes:
      - insightface_models:/root/.insightface

  frontend:
    image: tlam281206/ai-facial-recognition-frontend:latest
    restart: unless-stopped
    env_file:
      - path: .env.docker.example
        required: true
      - path: .env.docker
        required: false
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
  minio_data:
  qdrant_data:
  insightface_models:
