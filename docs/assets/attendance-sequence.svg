<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1240" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10 Z" fill="#111827"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#111827" stroke-width="1.5"/>
    </marker>
  </defs>

  <style>
    text { fill: #111827; }
    .title { font-size: 23px; font-weight: 700; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #4b5563; text-anchor: middle; }
    .label { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .stereo { font-size: 11px; fill: #475569; text-anchor: middle; }
    .actor-line, .symbol-line { fill: none; stroke: #111827; stroke-width: 1.9; stroke-linecap: round; }
    .symbol-circle, .actor-head { fill: #fff; stroke: #111827; stroke-width: 1.9; }
    .lifeline { stroke: #475569; stroke-width: 1.45; stroke-dasharray: 7,7; }
    .activation { fill: #fff; stroke: #111827; stroke-width: 1.3; }
    .frame { fill: none; stroke: #475569; stroke-width: 1.35; }
    .frame-title { fill: #e5e7eb; stroke: #475569; stroke-width: 1.35; }
    .frame-label { font-size: 13px; font-weight: 700; fill: #111827; }
    .divider { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 8,6; }
    .msg { stroke: #111827; stroke-width: 1.65; marker-end: url(#arrow); }
    .return { stroke: #334155; stroke-width: 1.45; stroke-dasharray: 8,6; marker-end: url(#open-arrow); }
    .self { fill: none; stroke: #111827; stroke-width: 1.55; marker-end: url(#arrow); }
    .msg-text { font-size: 13px; fill: #111827; text-anchor: middle; }
    .note { fill: #fff; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 7,5; rx: 8; }
    .note-text { font-size: 12px; fill: #374151; }
  </style>

  <rect x="0" y="0" width="1440" height="1240" fill="#fff"/>
  <text class="title" x="720" y="36">Sequence diagram - Cham cong kiosk</text>
  <text class="subtitle" x="720" y="58">Boundary-Control-Entity style: kiosk gui frame, controller nhan dien, vector store match va Redis gate chong trung.</text>

  <!-- Combined fragments -->
  <rect class="frame" x="24" y="170" width="1392" height="210"/>
  <rect class="frame-title" x="24" y="170" width="155" height="30"/>
  <text class="frame-label" x="40" y="190">phase 1: request</text>

  <rect class="frame" x="24" y="410" width="1392" height="255"/>
  <rect class="frame-title" x="24" y="410" width="150" height="30"/>
  <text class="frame-label" x="40" y="430">alt invalid frame</text>
  <text class="frame-label" x="52" y="470">[no valid face]</text>
  <line class="divider" x1="24" y1="555" x2="1416" y2="555"/>
  <text class="frame-label" x="52" y="585">[multiple faces]</text>

  <rect class="frame" x="24" y="700" width="1392" height="500"/>
  <rect class="frame-title" x="24" y="700" width="155" height="30"/>
  <text class="frame-label" x="40" y="720">alt one valid face</text>
  <text class="frame-label" x="52" y="835">[no active match]</text>
  <line class="divider" x1="24" y1="920" x2="1416" y2="920"/>
  <text class="frame-label" x="52" y="950">[active match]</text>

  <rect class="frame" x="572" y="1030" width="824" height="142"/>
  <rect class="frame-title" x="572" y="1030" width="70" height="28"/>
  <text class="frame-label" x="590" y="1049">alt</text>
  <text class="frame-label" x="660" y="1049">[recent record]</text>
  <line class="divider" x1="572" y1="1092" x2="1396" y2="1092"/>
  <text class="frame-label" x="660" y="1118">[new record]</text>

  <!-- Lifelines -->
  <line class="lifeline" x1="96" y1="150" x2="96" y2="1200"/>
  <line class="lifeline" x1="280" y1="150" x2="280" y2="1200"/>
  <line class="lifeline" x1="464" y1="150" x2="464" y2="1200"/>
  <line class="lifeline" x1="648" y1="150" x2="648" y2="1200"/>
  <line class="lifeline" x1="842" y1="150" x2="842" y2="1200"/>
  <line class="lifeline" x1="1036" y1="150" x2="1036" y2="1200"/>
  <line class="lifeline" x1="1230" y1="150" x2="1230" y2="1200"/>

  <!-- Participants -->
  <g id="employee">
    <circle class="actor-head" cx="96" cy="94" r="12"/>
    <line class="actor-line" x1="96" y1="106" x2="96" y2="138"/>
    <line class="actor-line" x1="74" y1="119" x2="118" y2="119"/>
    <line class="actor-line" x1="96" y1="138" x2="80" y2="162"/>
    <line class="actor-line" x1="96" y1="138" x2="112" y2="162"/>
    <text class="label" x="96" y="66">NhanVien</text>
  </g>

  <g id="kiosk-ui">
    <line class="symbol-line" x1="236" y1="84" x2="236" y2="122"/>
    <line class="symbol-line" x1="236" y1="103" x2="250" y2="103"/>
    <circle class="symbol-circle" cx="280" cy="103" r="34"/>
    <text class="stereo" x="280" y="151">&lt;&lt;boundary&gt;&gt;</text>
    <text class="label" x="280" y="168">KioskUI</text>
  </g>

  <g id="nginx-boundary">
    <line class="symbol-line" x1="420" y1="84" x2="420" y2="122"/>
    <line class="symbol-line" x1="420" y1="103" x2="434" y2="103"/>
    <circle class="symbol-circle" cx="464" cy="103" r="34"/>
    <text class="stereo" x="464" y="151">&lt;&lt;boundary&gt;&gt;</text>
    <text class="label" x="464" y="168">Nginx</text>
  </g>

  <g id="controller">
    <circle class="symbol-circle" cx="648" cy="103" r="34"/>
    <path class="symbol-line" d="M 634 75 L 660 66 M 634 75 L 660 84"/>
    <text class="stereo" x="648" y="151">&lt;&lt;control&gt;&gt;</text>
    <text class="label" x="648" y="168">AttendanceController</text>
  </g>

  <g id="vector-store">
    <circle class="symbol-circle" cx="842" cy="103" r="34"/>
    <line class="symbol-line" x1="812" y1="137" x2="872" y2="137"/>
    <text class="stereo" x="842" y="151">&lt;&lt;entity&gt;&gt;</text>
    <text class="label" x="842" y="168">FaceVectorStore</text>
  </g>

  <g id="redis-gate">
    <circle class="symbol-circle" cx="1036" cy="103" r="34"/>
    <line class="symbol-line" x1="1006" y1="137" x2="1066" y2="137"/>
    <text class="stereo" x="1036" y="151">&lt;&lt;entity&gt;&gt;</text>
    <text class="label" x="1036" y="168">RedisGate</text>
  </g>

  <g id="attendance-db">
    <circle class="symbol-circle" cx="1230" cy="103" r="34"/>
    <line class="symbol-line" x1="1200" y1="137" x2="1260" y2="137"/>
    <text class="stereo" x="1230" y="151">&lt;&lt;entity&gt;&gt;</text>
    <text class="label" x="1230" y="168">AttendanceDB</text>
  </g>

  <rect class="activation" x="642" y="318" width="12" height="70"/>

  <!-- Messages -->
  <line class="msg" x1="96" y1="235" x2="280" y2="235"/>
  <text class="msg-text" x="188" y="226">DuaMatVaoKhung()</text>
  <line class="msg" x1="280" y1="280" x2="464" y2="280"/>
  <text class="msg-text" x="372" y="271">GuiFrameChamCong(image, actionType)</text>
  <line class="msg" x1="464" y1="320" x2="648" y2="320"/>
  <text class="msg-text" x="556" y="311">ForwardWithKioskToken()</text>
  <path class="self" d="M 654 354 C 744 354, 744 386, 660 386"/>
  <text class="msg-text" x="758" y="348">NhanDienKhuonMat()</text>

  <line class="msg" x1="648" y1="500" x2="1230" y2="500"/>
  <text class="msg-text" x="939" y="491">GhiSuKienUnknownFace()</text>
  <line class="return" x1="648" y1="540" x2="280" y2="540"/>
  <text class="msg-text" x="464" y="532">unknown_face</text>
  <line class="msg" x1="648" y1="615" x2="1230" y2="615"/>
  <text class="msg-text" x="939" y="606">GhiSuKienMultipleFaces()</text>
  <line class="return" x1="648" y1="650" x2="280" y2="650"/>
  <text class="msg-text" x="464" y="642">multiple_faces</text>

  <line class="msg" x1="648" y1="750" x2="842" y2="750"/>
  <text class="msg-text" x="745" y="741">TimVectorGanNhat(embedding)</text>
  <path class="self" d="M 654 785 C 744 785, 744 815, 660 815"/>
  <text class="msg-text" x="765" y="779">KiemTraNguongVaNhanVienActive()</text>
  <line class="msg" x1="648" y1="860" x2="1230" y2="860"/>
  <text class="msg-text" x="939" y="851">GhiSuKienUnknownFace()</text>
  <line class="return" x1="648" y1="895" x2="280" y2="895"/>
  <text class="msg-text" x="464" y="887">unknown_face</text>

  <line class="msg" x1="648" y1="980" x2="1036" y2="980"/>
  <text class="msg-text" x="842" y="971">KiemTraCameraGate(cameraId, actionType)</text>
  <line class="msg" x1="648" y1="1015" x2="1230" y2="1015"/>
  <text class="msg-text" x="939" y="1006">KiemTraSuKienGanDay(employeeId)</text>
  <line class="return" x1="648" y1="1068" x2="280" y2="1068"/>
  <text class="msg-text" x="464" y="1060">recorded(existingEventId)</text>
  <line class="msg" x1="648" y1="1130" x2="1230" y2="1130"/>
  <text class="msg-text" x="939" y="1121">LuuSuKienChamCong()</text>
  <line class="msg" x1="648" y1="1160" x2="1036" y2="1160"/>
  <text class="msg-text" x="842" y="1151">DatGateTTL5Phut()</text>
  <line class="return" x1="648" y1="1190" x2="280" y2="1190"/>
  <text class="msg-text" x="464" y="1182">recorded(newEventId)</text>

  <rect class="note" x="1120" y="222" width="265" height="78"/>
  <text class="note-text" x="1138" y="246">Direct backend without kiosk token</text>
  <text class="note-text" x="1138" y="266">returns 401. Public demo should</text>
  <text class="note-text" x="1138" y="286">go through Nginx/ngrok.</text>

  <!-- Redraw frame labels above lifelines -->
  <rect class="frame-title" x="24" y="170" width="155" height="30"/>
  <text class="frame-label" x="40" y="190">phase 1: request</text>
  <rect class="frame-title" x="24" y="410" width="150" height="30"/>
  <text class="frame-label" x="40" y="430">alt invalid frame</text>
  <rect class="frame-title" x="24" y="700" width="155" height="30"/>
  <text class="frame-label" x="40" y="720">alt one valid face</text>
</svg>
