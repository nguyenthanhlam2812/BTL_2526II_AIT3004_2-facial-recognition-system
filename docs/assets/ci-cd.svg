<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f7f7f7" stroke-width="0.4"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10 Z" fill="#222"/>
    </marker>
  </defs>

  <style>
    text { fill: #111; }
    .title { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .subtitle { font-size: 12px; fill: #555; text-anchor: middle; }
    .box { fill: #fff; stroke: #222; stroke-width: 1.65; rx: 8; }
    .box-title { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .box-text { font-size: 11.5px; text-anchor: middle; fill: #333; }
    .flow { stroke: #222; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .label { font-size: 11px; fill: #444; text-anchor: middle; }
    .note { fill: #fff; stroke: #999; stroke-width: 1.1; stroke-dasharray: 5,4; rx: 6; }
  </style>

  <rect x="0" y="0" width="1240" height="760" fill="#fff"/>
  <rect x="0" y="0" width="1240" height="760" fill="url(#grid)" opacity="0.45"/>
  <text class="title" x="620" y="38">Luồng CI/CD</text>
  <text class="subtitle" x="620" y="58">GitHub Actions kiểm thử, validate compose, build 4 Docker image và smoke test image đã publish</text>

  <g id="trigger">
    <rect class="box" x="470" y="95" width="300" height="70"/>
    <text class="box-title" x="620" y="122">Push / Pull request vào main</text>
    <text class="box-text" x="620" y="146">workflow: .github/workflows/ci.yml</text>
  </g>

  <g id="backend-tests">
    <rect class="box" x="75" y="255" width="270" height="105"/>
    <text class="box-title" x="210" y="282">Backend tests</text>
    <text class="box-text" x="210" y="307">Python 3.11</text>
    <text class="box-text" x="210" y="327">requirements/backend + test</text>
    <text class="box-text" x="210" y="347">pytest tests/backend -q</text>
  </g>

  <g id="frontend-check">
    <rect class="box" x="485" y="255" width="270" height="105"/>
    <text class="box-title" x="620" y="282">Frontend check</text>
    <text class="box-text" x="620" y="307">Node.js 20 + npm ci</text>
    <text class="box-text" x="620" y="327">npm run lint</text>
    <text class="box-text" x="620" y="347">test:run + build</text>
  </g>

  <g id="compose-config">
    <rect class="box" x="895" y="255" width="270" height="105"/>
    <text class="box-title" x="1030" y="282">Compose config</text>
    <text class="box-text" x="1030" y="307">docker compose config</text>
    <text class="box-text" x="1030" y="327">docker-compose.ngrok.yml</text>
    <text class="box-text" x="1030" y="347">profile ngrok + dummy token</text>
  </g>

  <g id="build-images">
    <rect class="box" x="430" y="455" width="380" height="100"/>
    <text class="box-title" x="620" y="482">Build Docker images</text>
    <text class="box-text" x="620" y="507">backend, worker, frontend, nginx</text>
    <text class="box-text" x="620" y="527">docker/build-push-action + GHA cache</text>
  </g>

  <g id="push-images">
    <rect class="box" x="175" y="635" width="300" height="80"/>
    <text class="box-title" x="325" y="662">Push Docker Hub</text>
    <text class="box-text" x="325" y="687">Chỉ chạy khi push main</text>
    <text class="box-text" x="325" y="705">namespace: tlam281206</text>
  </g>

  <g id="smoke">
    <rect class="box" x="765" y="625" width="340" height="100"/>
    <text class="box-title" x="935" y="652">Docker Hub smoke test</text>
    <text class="box-text" x="935" y="677">docker compose pull + up -d</text>
    <text class="box-text" x="935" y="697">healthz, login, settings auth</text>
    <text class="box-text" x="935" y="717">kiosk token enforcement</text>
  </g>

  <path class="flow" d="M 620 165 L 210 255"/>
  <path class="flow" d="M 620 165 L 620 255"/>
  <path class="flow" d="M 620 165 L 1030 255"/>
  <path class="flow" d="M 210 360 C 210 425, 430 425, 500 455"/>
  <path class="flow" d="M 620 360 L 620 455"/>
  <path class="flow" d="M 1030 360 C 1030 425, 810 425, 740 455"/>
  <path class="flow" d="M 620 555 C 620 605, 325 595, 325 635"/>
  <path class="flow" d="M 475 675 L 765 675"/>
  <text class="label" x="620" y="604">push main only</text>

  <rect class="note" x="935" y="95" width="230" height="78"/>
  <text class="box-text" x="1050" y="122">Pull request dừng sau build check.</text>
  <text class="box-text" x="1050" y="144">Push main mới publish image</text>
  <text class="box-text" x="1050" y="164">và chạy smoke test.</text>
</svg>
