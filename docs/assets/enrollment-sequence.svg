<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1160" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10 Z" fill="#111827"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#111827" stroke-width="1.5"/>
    </marker>
  </defs>

  <style>
    text { fill: #111827; }
    .title { font-size: 23px; font-weight: 700; text-anchor: middle; }
    .subtitle { font-size: 13px; fill: #4b5563; text-anchor: middle; }
    .label { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .stereo { font-size: 11px; fill: #475569; text-anchor: middle; }
    .actor-line, .symbol-line { fill: none; stroke: #111827; stroke-width: 1.9; stroke-linecap: round; }
    .symbol-circle, .actor-head { fill: #fff; stroke: #111827; stroke-width: 1.9; }
    .lifeline { stroke: #475569; stroke-width: 1.45; stroke-dasharray: 7,7; }
    .activation { fill: #fff; stroke: #111827; stroke-width: 1.3; }
    .frame { fill: none; stroke: #475569; stroke-width: 1.35; }
    .frame-title { fill: #e5e7eb; stroke: #475569; stroke-width: 1.35; }
    .frame-label { font-size: 13px; font-weight: 700; fill: #111827; }
    .divider { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 8,6; }
    .msg { stroke: #111827; stroke-width: 1.65; marker-end: url(#arrow); }
    .return { stroke: #334155; stroke-width: 1.45; stroke-dasharray: 8,6; marker-end: url(#open-arrow); }
    .self { fill: none; stroke: #111827; stroke-width: 1.55; marker-end: url(#arrow); }
    .msg-text { font-size: 13px; fill: #111827; text-anchor: middle; }
    .note { fill: #fff; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 7,5; rx: 8; }
    .note-text { font-size: 12px; fill: #374151; }
  </style>

  <rect x="0" y="0" width="1440" height="1160" fill="#fff"/>
  <text class="title" x="720" y="36">Sequence diagram - Dang ky khuon mat</text>
  <text class="subtitle" x="720" y="58">Boundary-Control-Entity style: UI gui yeu cau, controller tao job, worker xu ly anh va ghi embedding.</text>

  <!-- Combined fragments behind messages -->
  <rect class="frame" x="24" y="170" width="1392" height="180"/>
  <rect class="frame-title" x="24" y="170" width="178" height="30"/>
  <text class="frame-label" x="40" y="190">phase 1: create employee</text>

  <rect class="frame" x="24" y="382" width="1392" height="285"/>
  <rect class="frame-title" x="24" y="382" width="190" height="30"/>
  <text class="frame-label" x="40" y="402">phase 2: submit enrollment</text>

  <rect class="frame" x="24" y="700" width="1392" height="392"/>
  <rect class="frame-title" x="24" y="700" width="194" height="30"/>
  <text class="frame-label" x="40" y="720">phase 3: worker processing</text>

  <rect class="frame" x="1010" y="895" width="382" height="102"/>
  <rect class="frame-title" x="1010" y="895" width="70" height="28"/>
  <text class="frame-label" x="1030" y="914">alt</text>
