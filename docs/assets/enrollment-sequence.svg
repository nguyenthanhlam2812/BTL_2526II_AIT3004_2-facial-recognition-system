    <line class="symbol-line" x1="1318" y1="137" x2="1378" y2="137"/>
    <text class="stereo" x="1348" y="151">&lt;&lt;entity&gt;&gt;</text>
    <text class="label" x="1348" y="168">FaceVectorStore</text>
