  <line class="lifeline" x1="262" y1="150" x2="262" y2="1110"/>
  <line class="lifeline" x1="444" y1="150" x2="444" y2="1110"/>
  <line class="lifeline" x1="626" y1="150" x2="626" y2="1110"/>
  <line class="lifeline" x1="808" y1="150" x2="808" y2="1110"/>
