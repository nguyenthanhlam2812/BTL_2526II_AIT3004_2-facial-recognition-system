<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 900" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#edf2f7" stroke-width="0.8"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <marker id="fkArrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#555"/>
    </marker>
    <marker id="oneMark" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="1" refY="5" orient="auto">
      <path d="M 3 1 L 3 9 M 6 1 L 6 9" stroke="#555" stroke-width="1.4"/>
    </marker>
    <symbol id="keyIcon" viewBox="0 0 14 14">
      <circle cx="5" cy="5" r="3" fill="#facc15" stroke="#b45309" stroke-width="1"/>
      <path d="M7.5 7.5 L12.5 12.5 M10 10 L12 8 M11.4 11.4 L13 9.8" stroke="#b45309" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="fieldIcon" viewBox="0 0 14 14">
      <path d="M7 1.5 L12.5 7 L7 12.5 L1.5 7 Z" fill="#baf2f0" stroke="#38b2ac" stroke-width="1.1"/>
    </symbol>
    <symbol id="fkIcon" viewBox="0 0 14 14">
      <path d="M7 1.5 L12.5 7 L7 12.5 L1.5 7 Z" fill="#ffd9d9" stroke="#e57373" stroke-width="1.1"/>
    </symbol>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <style>
    .canvas { fill: #fff; }
    .table { fill: #fff; stroke: #8b9aaa; stroke-width: 1.2; filter: url(#shadow); }
    .head { fill: #9fc5dc; stroke: #7fa8bf; stroke-width: 1.2; }
    .idx { fill: #c7c7c7; stroke: #a7a7a7; stroke-width: 1; }
    .name { fill: #111; font-size: 16px; font-weight: 700; }
    .field { fill: #111; font-size: 13px; }
    .idx-text { fill: #fff; font-size: 15px; font-weight: 700; }
    .fold { fill: #6b7280; }
    .rel { fill: none; stroke: #555; stroke-width: 1.6; stroke-dasharray: 8 6; marker-end: url(#fkArrow); }
    .rel-solid { fill: none; stroke: #555; stroke-width: 1.6; marker-end: url(#fkArrow); }
    .rel-label { fill: #334155; font-size: 11px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
    .note { fill: #fff7ed; stroke: #f97316; stroke-width: 1.2; }
    .note-text { fill: #7c2d12; font-size: 12px; }
  </style>

  <rect class="canvas" width="1350" height="900"/>
  <rect width="1350" height="900" fill="url(#grid)"/>

  <!-- enrollment_images -->
  <g id="enrollment_images" transform="translate(6 30)">
    <rect class="table" width="248" height="420" rx="4"/>
    <rect class="head" width="248" height="30" rx="4"/>
    <use href="#fieldIcon" x="12" y="8" width="14" height="14"/>
    <text class="name" x="36" y="21">enrollment_images</text>
    <path class="fold" d="M232 10 L240 10 L236 17 Z"/>
    <use href="#keyIcon" x="12" y="43" width="14" height="14"/><text class="field" x="32" y="55">id INT</text>
    <use href="#fkIcon" x="12" y="74" width="14" height="14"/><text class="field" x="32" y="86">enrollment_id INT</text>
    <use href="#fieldIcon" x="12" y="105" width="14" height="14"/><text class="field" x="32" y="117">object_key VARCHAR(512)</text>
    <use href="#fieldIcon" x="12" y="136" width="14" height="14"/><text class="field" x="32" y="148">original_file_name VARCHAR(255)</text>
    <use href="#fieldIcon" x="12" y="167" width="14" height="14"/><text class="field" x="32" y="179">content_type VARCHAR(128)</text>
    <use href="#fieldIcon" x="12" y="198" width="14" height="14"/><text class="field" x="32" y="210">sort_order INT</text>
    <use href="#fieldIcon" x="12" y="229" width="14" height="14"/><text class="field" x="32" y="241">processing_status VARCHAR(32)</text>
    <use href="#fieldIcon" x="12" y="260" width="14" height="14"/><text class="field" x="32" y="272">qdrant_point_id VARCHAR(128)</text>
    <use href="#fieldIcon" x="12" y="291" width="14" height="14"/><text class="field" x="32" y="303">error_message TEXT</text>
    <use href="#fieldIcon" x="12" y="322" width="14" height="14"/><text class="field" x="32" y="334">created_at DATETIME</text>
    <use href="#fieldIcon" x="12" y="353" width="14" height="14"/><text class="field" x="32" y="365">updated_at DATETIME</text>
    <rect class="idx" y="390" width="248" height="30"/>
    <text class="idx-text" x="14" y="411">Indexes</text>
    <path class="fold" d="M226 401 L236 406 L226 411 Z"/>
  </g>

