    <use href="#fieldIcon" x="12" y="291" width="14" height="14"/><text class="field" x="32" y="303">created_at DATETIME</text>
    <use href="#fieldIcon" x="12" y="322" width="14" height="14"/><text class="field" x="32" y="334">updated_at DATETIME</text>
    <use href="#fieldIcon" x="12" y="353" width="14" height="14"/><text class="field" x="32" y="365">completed_at DATETIME</text>
    <rect class="idx" y="375" width="190" height="30"/>
    <text class="idx-text" x="14" y="396">Indexes</text>
    <path class="fold" d="M168 386 L178 391 L168 396 Z"/>
  </g>

